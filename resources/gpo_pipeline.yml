resources:
  pipelines:
    gpo_ingest:
      name: gpo-ingest-${var.schema}
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      libraries:
        - notebook:
            path: ../src/pipelines/sdp_gpo_ingest.py
      configuration:
        gpo.catalog: ${var.catalog}
        gpo.schema: ${var.schema}
      # Development deploys prefix the pipeline name. Existing bronze/silver
      # tables in a busy schema may already belong to another pipeline. Use a
      # fresh schema if ingest fails with "already managed by pipeline".
